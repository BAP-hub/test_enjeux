<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Enjeux environnementaux UBS</title>

<link rel="stylesheet"
      href="https://js.arcgis.com/4.30/esri/themes/light/main.css">

<script.com/4.30/"></script>

://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.success{
    color:green;
}

.error{
    color:red;
}

h3{
    margin-top:20px;
    margin-bottom:5px;
}

ul{
    margin-top:5px;
}

</style>

</head>

<body>

<h2>Enjeux environnementaux</h2>

<div id="result" class="card">
Connexion ArcGIS Online...
</div>

<script>

window.onerror = function(message, source, lineno){

    document.getElementById("result").innerHTML =
        "<div class='error'><b>Erreur JavaScript</b><br>" +
        message +
        "<br>Ligne : " +
        lineno +
        "</div>";
};

require([
    "esri/identity/OAuthInfo",
    "esri/identity/IdentityManager",
    "esri/portal/Portal"
], function(
    OAuthInfo,
    esriId,
    Portal
){

    const oauthInfo = new OAuthInfo({
        appId: "yh0uBe36MXyPzk1q",
        portalUrl: "https://www.arcgis.com",
        popup: true
    });

    esriId.registerOAuthInfos([oauthInfo]);

    esriId.checkSignInStatus(
        "https://www.arcgis.com/sharing"
    )
    .then(startApplication)
    .catch(() => {

        esriId.getCredential(
            "https://www.arcgis.com/sharing"
        )
        .then(startApplication)
        .catch(() => {

            document.getElementById("result").innerHTML =
                "<div class='error'>Authentification ArcGIS Online requise</div>";

        });

    });

    async function startApplication(){

        const portal = new Portal();

        portal.authMode = "immediate";

        await portal.load();

        document.getElementById("result").innerHTML =
            "<div class='success'>✅ Connecté : "
            + portal.user.fullName +
            "</div><br>Analyse des enjeux...";

        main();
    }
});

const couches = [

    {
        nom: "APPB",
        typeName: "patrinat_apb:apb"
    },

    {
        nom: "Natura 2000 SIC",
        typeName: "patrinat_sic:sic"
    },

    {
        nom: "Natura 2000 ZPS",
        typeName: "patrinat_sc:sc"
    },

    {
        nom: "ZNIEFF Type 1",
        typeName: "patrinat_znieff1:znieff1"
    },

    {
        nom: "ZNIEFF Type 2",
        typeName: "patrinat_znieff2:znieff2"
    }

];

async function main(){

    const result = document.getElementById("result");

    const params = new URLSearchParams(window.location.search);

    const objectid = params.get("id");

    if(!objectid){

        result.innerHTML =
        "<div class='error'>OBJECTID manquant dans l'URL</div>";

        return;
    }

    try{

        const agolUrl =
        "https://services-eu1.arcgis.com/Kxsn3iT6KEQ7OlSW/arcgis/rest/services/UBS_Sites_Prospection_FR/FeatureServer/1/query" +
        "?where=OBJECTID=" + objectid +
        "&outFields=*" +
        "&returnGeometry=true" +
        "&f=geojson";

        const response = await fetch(agolUrl);

        const data = await response.json();

        if(!data.features || data.features.length === 0){

            result.innerHTML =
            "<div class='error'>Aucune emprise trouvée.</div>";

            return;
        }

        const emprise = data.features[0];

        const bbox = turf.bbox(emprise);

        let html =
        "<div class='success'><b>Analyse terminée</b></div>";

        for(const couche of couches){

            html += "<h3>" + couche.nom + "</h3>";

            try{

                const wfsUrl =
                "https://data.geopf.fr/wfs/ows" +
                "?service=WFS" +
                "&version=2.0.0" +
                "&request=GetFeature" +
                "&typeNames=" + couche.typeName +
                "&outputFormat=application/json" +
                "&srsName=EPSG:4326" +
                "&bbox=" +
                bbox[0] + "," +
                bbox[1] + "," +
                bbox[2] + "," +
                bbox[3] +
                ",EPSG:4326";

                const wfsResponse = await fetch(wfsUrl);

                const geojson = await wfsResponse.json();

                if(
                    !geojson.features ||
                    geojson.features.length === 0
                ){

                    html += "<div>Aucun enjeu</div>";

                    continue;
                }

                const intersections = [];

                geojson.features.forEach(f => {

                    try{

                        if(
                            turf.booleanIntersects(
                                emprise,
                                f
                            )
                        ){

                            intersections.push(f);

                        }

                    }catch(e){

                        console.error(e);

                    }

                });

                if(intersections.length === 0){

                    html += "<div>Aucun enjeu</div>";

                    continue;
                }

                const nomsUniques = [

                    ...new Set(

                        intersections.map(f =>

                            f.properties.nom_site ||
                            "Nom non renseigné"

                        )

                    )

                ];

                html +=
                "<div class='success'>" +
                nomsUniques.length +
                " enjeu(x) détecté(s)</div>";

                html += "<ul>";

                nomsUniques.forEach(nom => {

                    html += "<li>" + nom + "</li>";

                });

                html += "</ul>";

            }
            catch(error){

                console.error(error);

                html +=
                    "<div class='error'>Erreur de lecture de la couche</div>";
            }
        }

        result.innerHTML = html;

    }
    catch(error){

        result.innerHTML =
        "<div class='error'>Erreur : "
        + error +
        "</div>";
    }
}

</script>

</body>
</html>
